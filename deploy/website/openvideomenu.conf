# Apache site for openvideomenu.org: the static site from the repo's site/ folder (without README.md and tools/),
# in /var/www/openvideomenu. certbot --apache -d openvideomenu.org -d www.openvideomenu.org adds the HTTPS site.
<VirtualHost *:80>
    ServerName openvideomenu.org
    ServerAlias www.openvideomenu.org
    DocumentRoot /var/www/openvideomenu
    ErrorDocument 404 /404.html
    <Directory /var/www/openvideomenu>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>
    # The Linux installer is piped to sh: serve it as plain text.
    <Files "menu-server.sh">
        ForceType text/plain
    </Files>
    ErrorLog ${APACHE_LOG_DIR}/openvideomenu-error.log
    CustomLog ${APACHE_LOG_DIR}/openvideomenu-access.log combined
</VirtualHost>
