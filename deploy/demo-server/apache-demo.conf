# Apache site for the demo: the public name, proxied to Jellyfin on localhost. certbot --apache adds
# the HTTPS site next to it. While Jellyfin is stopped, visitors get a 503.
<VirtualHost *:80>
    ServerName demo.openvideomenu.org
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8096/
    ProxyPassReverse / http://127.0.0.1:8096/
    ErrorLog ${APACHE_LOG_DIR}/ovm-demo-error.log
    CustomLog ${APACHE_LOG_DIR}/ovm-demo-access.log combined
</VirtualHost>
