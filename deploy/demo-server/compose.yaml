# The public demo: Jellyfin with the Open Video Menu plugin and the example titles, for app-store
# reviewers and anyone trying ovmplayer without a library of their own. See README.md.
#
#   docker compose up -d     # start (it then stays up, across reboots)
#   docker compose stop      # stop
#
# Jellyfin listens on localhost only; the host's web server proxies the public name to it.
services:
  jellyfin:
    image: jellyfin/jellyfin:12.2
    container_name: ovm-demo-jellyfin
    user: "1000:1000"
    restart: unless-stopped
    ports:
      - "127.0.0.1:8096:8096"
    environment:
      JELLYFIN_PublishedServerUrl: https://demo.openvideomenu.org
    volumes:
      - ./config:/config
      - ./cache:/cache
      # Read-only: the demo titles and their menus.
      - ./media:/media:ro
    # The host is small (2 GB) and serves other sites: if Jellyfin runs out of memory, only Jellyfin
    # stops. It peaks around 300 MB scanning the library and 200 MB streaming.
    mem_limit: 768m
    memswap_limit: 1g
    security_opt:
      - no-new-privileges:true
