<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Menu</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}#player{position:fixed;inset:0}</style>
</head>
<body>
<div id="player"></div>
<script src="menustream-player.js"></script>
<script>
  // The native app injects `menustreamHost` (a message port) before this page loads.
  if (window.menustreamHost) MenuStreamPlayer.runInHost(window.menustreamHost, document.getElementById("player"));
  else document.body.insertAdjacentHTML("beforeend", "<p style='color:#fff;font:20px sans-serif;padding:2em'>No native host.</p>");
</script>
</body>
</html>
