# Publishes the .NET packages (OpenVideoMenu, OpenVideoMenu.Dvd, OpenVideoMenu.Dvd.Tool) to nuget.org when a
# release is published: the draft release.yml made, published by hand. nuget.org versions can be unlisted
# but never removed, so this never runs before that.
#
# Secret (Settings → Secrets and variables → Actions):
#   NUGET_API_KEY   a nuget.org API key allowed to push these package ids

name: Publish NuGet packages

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  nuget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - name: The release's packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ github.event.release.tag_name }}" --repo "${{ github.repository }}" --pattern "*.nupkg" --dir nupkg
      - name: Push
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then echo "NUGET_API_KEY isn't set: nothing published." >&2; exit 1; fi
          dotnet nuget push "nupkg/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
