# Publishes the packages when a release is published: the draft release.yml made, published by hand.
# Registry versions can be deprecated or unlisted but never replaced, so this never runs before that.
#   - .NET (nuget.org): OpenVideoMenu, OpenVideoMenu.Dvd, OpenVideoMenu.Dvd.Tool
#   - npm: @openvideomenu/core, renderer-web, asset-server, cli
#   - the menu server's Docker image: ghcr.io/<owner>/openvideomenu-menu-server, tagged with the version and
#     latest, for linux/amd64 and linux/arm64, built from the release's tag (needs no secret: GITHUB_TOKEN)
#
# nuget.org: trusted publishing. A nuget.org trusted publishing policy names this repository and this workflow file;
# NuGet/login trades the run's GitHub identity for a short-lived API key. No stored key.
#   variable NUGET_USER   the nuget.org account (profile name, not email) that owns the policy
# npm: trusted publishing too, once each package has a trusted publisher on npmjs.com (repository and this workflow
# file); npm can only add one to a package that exists. Until then, or for a new package:
#   secret NPM_TOKEN      an npm token with publish rights to the @openvideomenu scope (leave unset once every
#                         package has a trusted publisher)
#
# A release event runs this file as it was at the release's tag. To run the current file for a release already
# published (a registry that failed, or one added later), start it by hand with the tag and the registry.

name: Publish packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v1.0.0-preview.1
        required: true
      registry:
        description: Which to publish
        type: choice
        options: [nuget, npm, docker, all]
        default: nuget

permissions:
  contents: read

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  nuget:
    if: github.event_name == 'release' || inputs.registry == 'nuget' || inputs.registry == 'all'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - name: The release's packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" --repo "${{ github.repository }}" --pattern "*.nupkg" --dir nupkg
      - name: nuget.org sign-in
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Push
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "nupkg/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

  npm:
    if: github.event_name == 'release' || inputs.registry == 'npm' || inputs.registry == 'all'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 24, registry-url: "https://registry.npmjs.org" }
      - name: The release's packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" --repo "${{ github.repository }}" --pattern "openvideomenu-*.tgz" --dir npm
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Trusted publishing (npm 11.5 or later) when the package has a trusted publisher, else NPM_TOKEN.
          npm install -g npm@latest
          # core first: the others depend on it. "latest" also for a preview: it's what plain npm install takes.
          # "./": npm reads "npm/x.tgz" as a GitHub repository (user/repo).
          for f in ./npm/openvideomenu-core-*.tgz $(ls ./npm/*.tgz | grep -v openvideomenu-core-); do
            npm publish "$f" --access public --tag latest
          done

  docker:
    if: github.event_name == 'release' || inputs.registry == 'docker' || inputs.registry == 'all'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.TAG }}" }
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Image name and tags
        id: image
        run: |
          IMAGE="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/openvideomenu-menu-server"
          echo "tags=$IMAGE:${TAG#v},$IMAGE:latest" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/asset-server.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Open Video Menu menu server: menus for Plex and Jellyfin libraries
            org.opencontainers.image.licenses=Apache-2.0
