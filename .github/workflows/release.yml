# Builds every release artifact from a version tag (v0.1.2) and attaches them to a DRAFT GitHub
# release. Nothing is public until someone publishes the draft by hand.
#
# Secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   the release keystore (.jks), base64-encoded
#   OVM_KEYSTORE_PASSWORD, OVM_KEY_ALIAS, OVM_KEY_PASSWORD
# Without them the Android builds are unsigned (fine for a dry run, not for users).
#
# The .NET packages go to nuget.org when the draft is published (publish-nuget.yml), not before.
#
# The Roku package is attached unsigned: signing needs a Roku in developer mode with the channel's
# key (apps/roku/tools/package.mjs --sign), so it's done by hand.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. 0.1.2 (a dry run: artifacts only, no release)"
        required: true

permissions:
  contents: write

env:
  VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x\n10.0.x" }
      - run: dotnet test sdk/dotnet/OpenVideoMenu.sln -c Release
      - name: Roku compile check
        working-directory: apps/roku
        run: npm ci && npx bsc --create-package false

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci && npm run build   # the menu renderer the app bundles
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Android platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" > /dev/null
      - name: Keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "OVM_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: building unsigned."
          fi
      - name: Build APK and App Bundle
        working-directory: apps/androidtv
        env:
          OVM_KEYSTORE_PASSWORD: ${{ secrets.OVM_KEYSTORE_PASSWORD }}
          OVM_KEY_ALIAS: ${{ secrets.OVM_KEY_ALIAS }}
          OVM_KEY_PASSWORD: ${{ secrets.OVM_KEY_PASSWORD }}
        run: |
          V="${VERSION#v}"
          ./gradlew --no-daemon assembleRelease bundleRelease -PversionCode=${{ github.run_number }} -PversionName="$V"
          mkdir -p ../../dist
          cp app/build/outputs/apk/release/app-release*.apk "../../dist/ovmplayer-androidtv-$V.apk"
          cp app/build/outputs/bundle/release/app-release.aab "../../dist/ovmplayer-androidtv-$V.aab"
      - uses: actions/upload-artifact@v4
        with: { name: android, path: dist/ }

  roku:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - working-directory: apps/roku
        run: |
          npm ci
          node tools/package.mjs --version "${VERSION#v}"
          mkdir -p ../../dist && cp out/ovmplayer-roku-*.zip ../../dist/
      - uses: actions/upload-artifact@v4
        with: { name: roku, path: dist/ }

  dotnet:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x\n10.0.x" }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: NuGet packages
        run: |
          V="${VERSION#v}"
          # OpenVideoMenu.Dvd depends on OpenVideoMenu at the same version; the tool on both.
          dotnet pack sdk/dotnet/OpenVideoMenu/OpenVideoMenu.csproj -c Release -p:Version="$V" -o dist
          dotnet pack sdk/dotnet-dvd/OpenVideoMenu.Dvd/OpenVideoMenu.Dvd.csproj -c Release -p:Version="$V" -o dist
          dotnet pack sdk/dotnet-dvd/ovm-dvd/ovm-dvd.csproj -c Release -p:Version="$V" -o dist
      - name: Jellyfin plugin
        run: |
          V="${VERSION#v}"
          dotnet build plugins/jellyfin/Jellyfin.Plugin.OpenVideoMenu -c Release -p:Version="$V"
          node plugins/jellyfin/tools/package.mjs --version "$V" --out dist \
            --url "https://github.com/${{ github.repository }}/releases/download/v$V/open-video-menu_$V.0.zip"
      - uses: actions/upload-artifact@v4
        with: { name: dotnet, path: dist/ }

  examples:
    needs: test
    # Windows draws the menus in Georgia, like the demo server's (Linux has no Georgia).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: choco install ffmpeg --no-progress -y
      - name: Build the examples (Sintel with the real film)
        shell: bash
        run: |
          node examples/sintel/build.mjs --film
          node examples/dvd-shaped/build.mjs
          node examples/package.mjs --out dist/openvideomenu-examples.zip
      - uses: actions/upload-artifact@v4
        with: { name: examples, path: dist/ }

  release:
    if: github.event_name == 'push'
    needs: [android, roku, dotnet, examples]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" dist/* --repo "${{ github.repository }}" --draft \
            --title "Open Video Menu $VERSION" \
            --notes "Draft: players, Jellyfin plugin, .NET packages and the example titles for $VERSION. Sign the Roku zip on a device before uploading it to the Roku Developer Dashboard."
